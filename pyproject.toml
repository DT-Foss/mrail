[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrail"
version = "0.4.1"
description = "Append-only maps of exact language-model runs (.mrail format, reference reader/writer)"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "David Tom Foss", email = "d.foss@ieee.org"}]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["language models", "inference", "constant state", "compute once", "kv cache", "maps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/DT-Foss/mrail"
Repository = "https://github.com/DT-Foss/mrail"
Specification = "https://github.com/DT-Foss/mrail/blob/main/SPEC.md"

[tool.setuptools]
packages = ["mrail"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrail"
version = "0.3.0"
description = "Append-only maps of exact language-model runs (.mrail format, reference reader/writer)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "David Tom Foss", email = "d.foss@ieee.org"}]
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["mrail"]
